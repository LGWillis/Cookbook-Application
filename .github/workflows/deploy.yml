# .github/workflows/deploy.yml
name: Cookbook CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Set up PostgreSQL
      run: |
        echo "PGHOST=localhost" >> $GITHUB_ENV
        echo "PGUSER=postgres" >> $GITHUB_ENV
        echo "PGPASSWORD=postgres" >> $GITHUB_ENV
        echo "PGDATABASE=test_db" >> $GITHUB_ENV
        echo "PGPORT=5432" >> $GITHUB_ENV

    - name: Install backend dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov

    - name: Run backend tests
      working-directory: backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      run: |
        python -m pytest -v --cov=.

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: frontend
      run: npm test -- --run

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        export_default_credentials: true

    - name: Configure Docker and Authenticate
      run: |
        # Write service account key to a file
        echo '${{ secrets.GCP_SA_KEY }}' > service-account.json
        # Authenticate with the service account
        gcloud auth activate-service-account --key-file=service-account.json
        # Configure Docker
        gcloud auth configure-docker --quiet
        # Set the project
        gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
        # Clean up the service account file
        rm -f service-account.json

    - name: Build and Push Backend Image
      working-directory: backend
      run: |
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-backend

    - name: Deploy Backend to Cloud Run
      run: |
        gcloud run deploy cookbook-backend \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-backend \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --allow-unauthenticated \
          --port 8000 \
          --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}"

    - name: Get Backend URL
      id: get-backend-url
      run: |
        BACKEND_URL=$(gcloud run services describe cookbook-backend \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --format 'value(status.url)')
        echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
        echo "BACKEND_URL=$BACKEND_URL"

    - name: Build Frontend
      working-directory: frontend
      env:
        VITE_API_BASE_URL: /api
      run: |
        # Install dependencies and build the frontend
        npm ci
        npm run build
        
        # Verify the dist directory was created
        ls -la dist/
        
        # Create a simple Dockerfile for the frontend
        cat > Dockerfile << 'EOF'
        FROM node:18-alpine as builder
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        RUN npm run build

        FROM nginx:alpine
        # Set the PORT environment variable to 8080 (Cloud Run's default if not specified)
        ENV PORT=8080
        
        # Copy nginx config
        COPY nginx.conf /etc/nginx/conf.d/default.conf.template
        
        # Copy built files
        COPY --from=builder /app/dist /usr/share/nginx/html
        
        # Create a startup script to handle environment variables
        RUN echo '#!/bin/sh \n\
          # Replace environment variables in nginx config
          envsubst "\$PORT \$BACKEND_URL" < /etc/nginx/conf.d/default.conf.template > /etc/nginx/conf.d/default.conf \n          \n          # Start nginx in the foreground
          exec nginx -g "daemon off;"' > /docker-entrypoint.sh \
          && chmod +x /docker-entrypoint.sh
        
        # Health check
        HEALTHCHECK --interval=30s --timeout=30s --start-period=5s --retries=3 CMD wget --no-verbose --tries=1 --spider http://localhost:${PORT}/ || exit 1
        
        EXPOSE $PORT
        CMD ["/docker-entrypoint.sh"]
        EOF

    - name: Build and Push Frontend Image
      working-directory: frontend
      run: |
        # Create .dockerignore
        echo -e "node_modules\n.git\n.gitignore\n.vscode\nDockerfile\n.dockerignore" > .dockerignore
        
        # Verify files are in place
        ls -la
        ls -la dist/
        
        # Build and push the Docker image
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-frontend .

    - name: Deploy Frontend to Cloud Run
      run: |
        # Get the backend URL if not set
        if [ -z "${{ env.BACKEND_URL }}" ]; then
          BACKEND_URL=$(gcloud run services describe cookbook-backend \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)')
          export BACKEND_URL
        else
          export BACKEND_URL="${{ env.BACKEND_URL }}"
        fi
        
        # Deploy the frontend
        gcloud run deploy cookbook-frontend \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-frontend \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --allow-unauthenticated \
          --port 8080 \
          --timeout 300s \
          --set-env-vars="PORT=8080,BACKEND_URL=${BACKEND_URL}" \
          --cpu 1 \
          --memory 1Gi \
          --min-instances 0 \
          --max-instances 3 \
          --concurrency 80
