# .github/workflows/deploy.yml
name: Cookbook CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Set up PostgreSQL
      run: |
        echo "PGHOST=localhost" >> $GITHUB_ENV
        echo "PGUSER=postgres" >> $GITHUB_ENV
        echo "PGPASSWORD=postgres" >> $GITHUB_ENV
        echo "PGDATABASE=test_db" >> $GITHUB_ENV
        echo "PGPORT=5432" >> $GITHUB_ENV

    - name: Install backend dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov

    - name: Run backend tests
      working-directory: backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      run: |
        python -m pytest -v --cov=.

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: frontend
      run: npm test -- --run

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        export_default_credentials: true

    - name: Configure Docker
      run: gcloud auth configure-docker

    - name: Build and Push Backend Image
      working-directory: backend
      run: |
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-backend

    - name: Deploy Backend to Cloud Run
      run: |
        gcloud run deploy cookbook-backend \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-backend \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --allow-unauthenticated \
          --port 8000 \
          --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}"

    - name: Get Backend URL
      id: get-backend-url
      run: |
        BACKEND_URL=$(gcloud run services describe cookbook-backend \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --format 'value(status.url)')
        echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
        echo "BACKEND_URL=$BACKEND_URL"

    - name: Build Frontend
      working-directory: frontend
      env:
        VITE_API_BASE_URL: /api
      run: |
        npm ci
        npm run build
        # Create a simple Dockerfile for the frontend
        echo 'FROM nginx:alpine
        COPY dist /usr/share/nginx/html
        COPY nginx.conf /etc/nginx/conf.d/default.conf
        RUN apk add --no-cache envsubst
        RUN envsubst "$(env | cut -d= -f1 | sed -e "s/^/\$/g")" < /etc/nginx/conf.d/default.conf > /etc/nginx/conf.d/default.conf.tmp \
          && mv /etc/nginx/conf.d/default.conf.tmp /etc/nginx/conf.d/default.conf
        EXPOSE 80
        CMD ["nginx", "-g", "daemon off;"]' > Dockerfile

    - name: Build and Push Frontend Image
      working-directory: frontend
      run: |
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-frontend

    - name: Deploy Frontend to Cloud Run
      run: |
        gcloud run deploy cookbook-frontend \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-frontend \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --allow-unauthenticated \
          --port 80 \
          --set-env-vars="BACKEND_URL=${{ env.BACKEND_URL }}"