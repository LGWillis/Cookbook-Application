# .github/workflows/deploy.yml
name: Cookbook CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Set up PostgreSQL
      run: |
        echo "PGHOST=localhost" >> $GITHUB_ENV
        echo "PGUSER=postgres" >> $GITHUB_ENV
        echo "PGPASSWORD=postgres" >> $GITHUB_ENV
        echo "PGDATABASE=test_db" >> $GITHUB_ENV
        echo "PGPORT=5432" >> $GITHUB_ENV

    - name: Install test dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt

    - name: Run backend tests
      working-directory: backend
      env:
        DJANGO_SETTINGS_MODULE: config.settings
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      run: |
        python -m pytest -v --cov=.

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: frontend
      run: npm test -- --run

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        export_default_credentials: true

    - name: Authenticate to Google Cloud
      run: |
        echo '${{ secrets.GCP_SA_KEY }}' > sa_key.json
        gcloud auth activate-service-account --key-file=sa_key.json
        gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
        gcloud auth configure-docker --quiet
        rm -f sa_key.json

    - name: Build and Push Backend Image
      working-directory: backend
      env:
        CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
      run: |
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-backend .

    - name: Deploy Backend to Cloud Run
      run: |
        echo "Deploying backend to Cloud Run..."
        
        # Deploy with minimal environment variables
        gcloud run deploy cookbook-backend \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-backend \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --allow-unauthenticated \
          --port 8000 \
          --update-env-vars="\
            DJANGO_SETTINGS_MODULE=config.settings,\
            DJANGO_DEBUG=False,\
            PYTHONUNBUFFERED=True,\
            DATABASE_URL=${{ secrets.DATABASE_URL }}\
          "
        
        echo "Backend deployment completed. Check Cloud Run logs for details."

    - name: Get Backend URL
      id: get-backend-url
      run: |
        BACKEND_URL=$(gcloud run services describe cookbook-backend \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --format 'value(status.url)')
        echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
        echo "BACKEND_URL=$BACKEND_URL"

    - name: Build Frontend
      working-directory: frontend
      env:
        VITE_API_BASE: /api
      run: |
        npm ci
        npm run build

    - name: Build and Push Frontend Image
      working-directory: frontend
      run: |
        # Build and push the Docker image
        gcloud builds submit \
          --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-frontend \
          --substitutions _BACKEND_URL=${{ env.BACKEND_URL }}

    - name: Deploy Frontend to Cloud Run
      run: |
        # Get the backend URL if not set
        if [ -z "${{ env.BACKEND_URL }}" ]; then
          echo "BACKEND_URL not set, attempting to get it from Cloud Run..."
          BACKEND_URL=$(gcloud run services describe cookbook-backend \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)' 2>/dev/null || echo "")
          
          if [ -z "${BACKEND_URL}" ]; then
            echo "WARNING: Could not get backend URL. Make sure the backend is deployed first."
            echo "Please set BACKEND_URL environment variable manually."
            exit 1
          fi
          export BACKEND_URL
        else
          export BACKEND_URL="${{ env.BACKEND_URL }}"
        fi
        
        echo "Using BACKEND_URL: ${BACKEND_URL}"
        
        # Deploy the frontend
        gcloud run deploy cookbook-frontend \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/cookbook-frontend \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --allow-unauthenticated \
          --port 8080 \
          --timeout 300s \
          --set-env-vars "BACKEND_URL=${BACKEND_URL}"